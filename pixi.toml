[workspace]
authors = ["Luis Pedro Coelho <luis@luispedro.org>"]
channels = ["conda-forge", "bioconda"]
name = "metag-workshops"
platforms = ["linux-64"]
version = "0.1.0"

# Databases are pre-installed on aqua (see PLAN.md). Downloading them is not
# part of the workshop.
[activation.env]
SINGLEM_METAPACKAGE_PATH = "/work/microbiome/db/singlem/S6.5.0.GTDB_r232.metapackage_20260319.smpkg.zb/payload_directory"
CHECKM2DB = "/work/microbiome/db/CheckM2_database/uniref100.KO.1.dmnd"
GUNC_DB = "/work/microbiome/db/gunc/1.0.1/gunc_db_2.0.4.dmnd"
EGGNOG_DATA_DIR = "/work/microbiome/db/eggnog-mapper/2.1.12"

[tasks]
# Building the workshop dataset (data-prep/): jug_hpc (data-prep/jug_hpc.toml)
# submits the jugfile's tasks to the queue. Inside the mqyolo sandbox there is
# no qsub: data-prep/scripts/hpc/qsub submits through mqsub.
submit = { cmd = "jug-hpc submit", cwd = "data-prep", env = { PATH = "$PIXI_PROJECT_ROOT/data-prep/scripts/hpc:$PATH", MQSUB_CWD = "$PIXI_PROJECT_ROOT" } }
# end-to-end test on the simulated data (data-prep/tests/jug_hpc.toml)
submit-test = { cmd = "jug-hpc -C tests submit", cwd = "data-prep", env = { WS_TEST = "1", PATH = "$PIXI_PROJECT_ROOT/data-prep/scripts/hpc:$PATH", MQSUB_CWD = "$PIXI_PROJECT_ROOT" } }
status = { cmd = "jug status jugfile.py", cwd = "data-prep" }
status-test = { cmd = "jug status --jugdir file_keepalive:tests/jugfile.jugdata jugfile.py", cwd = "data-prep", env = { WS_TEST = "1" } }
# the commands in the workshop notes match metag-ws (materials/check_commands.py)
check-commands = "python materials/check_commands.py"

[dependencies]
fastp = ">=1.4.0,<2"
fastplong = ">=0.7.1,<0.8"
singlem = ">=0.21.4,<0.22"
bwa = ">=0.7.19,<0.8"
polypolish = ">=0.7.1,<0.8"
minimap2 = ">=2.31,<3"
samtools = ">=1.25,<2"
semibin = ">=2.6.0,<3"
checkm2 = ">=1.1.0,<2"
gunc = ">=1.1.1,<2"
pyrodigal = ">=3.7.1,<4"
seqkit = ">=2.14.0,<3"
myloasm = ">=0.7.0,<0.8"
skani = ">=0.4.0,<0.5"
pandas = ">=3.0.6,<4"
rich = ">=15.0.0,<16"

# jug from main (jug execute --exclude-name, JUG_MAX_SECONDS), used by jug_hpc,
# which submits the jugfile's tasks to the queue (jug_hpc.toml). pixi.lock pins
# the commits.
[pypi-dependencies]
jug = { git = "https://github.com/luispedro/jug", branch = "main" }
jug_hpc = { git = "https://github.com/luispedro/jug_hpc", branch = "main" }
# the workshop helper (PLAN.md)
metag-ws = { path = "./metag-ws", editable = true }

# eggnog-mapper 2.1.15 needs diamond <2.1 while gunc 1.1.1 needs diamond 2.1.24,
# so it lives in its own environment: `pixi run -e eggnog emapper.py ...`
[feature.eggnog.dependencies]
eggnog-mapper = ">=2.1.15,<3"

# Building the workshop materials (materials/): pandoc turns the one markdown
# source into the slides and the handouts. Not needed on the workshop machine.
#   pixi run -e docs materials          # deck + both handouts (PDF and HTML)
#   pixi run -e docs check-materials    # no instructor notes in the handout
# Tectonic fetches LaTeX packages on first use, and the first deck build
# fetches reveal.js, so the first build needs network.
[feature.docs.dependencies]
pandoc = "3.11.*"
tectonic = "0.17.*"
font-ttf-dejavu = "*"
font-ttf-dejavu-sans-mono = "*"
# pdftotext, for check-materials
poppler = "*"
make = "*"
# ```dot diagrams (materials/common/filters/diagram.lua) and media/*.py plots
graphviz = ">=14.1.2,<15"
matplotlib-base = ">=3.11.2,<4"
python = ">=3.13"

[feature.docs.tasks]
materials = "make -C materials"
check-materials = "make -C materials check"
clean-materials = "make -C materials clean"

[environments]
eggnog = { features = ["eggnog"], no-default-feature = true }
docs = { features = ["docs"], no-default-feature = true }
