[project]
name = "metag-ws"
version = "0.1.0"
description = "Workshop helper: show, explain and fetch precomputed results for each step of the metagenomics workshop"
authors = [{ name = "Luis Pedro Coelho", email = "luis@luispedro.org" }]
requires-python = ">=3.11"
dependencies = ["rich"]

[project.scripts]
metag-ws = "metag_ws.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metag_ws"]
